services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekb
      POSTGRES_PASSWORD: ekb
      POSTGRES_DB: ekb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekb -d ekb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      SECRET_KEY: change-in-prod-use-long-random
      CHROMA_PATH: /data/chroma
      UPLOAD_DIR: /data/uploads
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
  appdata:
